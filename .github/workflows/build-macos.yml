name: Build Pulse macOS (.dmg)

# R-BuildMacOS: GitHub Actions workflow for Compose Multiplatform desktop on macOS.
# Builds a .dmg disk image on macos-latest (Apple Silicon by default).
#
# Output: build/compose/binaries/main/dmg/Pulse-1.0.0.dmg
#
# Trigger:
#   - manual:  Actions tab → "Build Pulse macOS" → Run workflow
#   - auto:    every push to main (artifact valid for 90 days, 1GB max)
#
# For universal binary (x86_64 + arm64): add "--target host:macosX64" + "host:macosArm64"
# See build.gradle.kts nativeDistributions block. Single-arch build is fine for v1.0.

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: read

jobs:
  build-dmg:
    name: Build .dmg on macOS
    # macos-14 = arm64, macos-13 = x86_64. Default to 14 (Apple Silicon).
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build .dmg
        # packageReleaseDmg → build/compose/binaries/main-release/dmg/Pulse-1.0.0.dmg
        run: ./gradlew packageReleaseDmg --no-daemon --stacktrace

      - name: Verify .dmg
        run: |
          set -e
          DMG=$(find build/compose/binaries -name 'Pulse-*.dmg' | head -n 1)
          if [ -z "$DMG" ]; then
            echo "::error::No .dmg produced"
            ls -laR build/compose/binaries/ || true
            exit 1
          fi
          echo "Built DMG: $DMG ($(du -h "$DMG" | cut -f1))"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-desktop-macos-dmg
          path: build/compose/binaries/**/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
