name: Build Pulse Linux (.deb)

# R-BuildLinux: GitHub Actions workflow for Compose Multiplatform desktop
# Builds a Debian package (.deb) on ubuntu-latest, suitable for Ubuntu 22.04+.
# Trigger:
#   - manual:  Actions tab → "Build Pulse Linux" → Run workflow
#   - auto:    every push to main (artifact valid for 90 days, 1GB max)
#
# Output: build/compose/binaries/main/deb/Pulse-1.0.0.deb (~50MB)
# Install: sudo dpkg -i Pulse-1.0.0.deb && sudo apt-get install -f

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-linux.yml'

permissions:
  contents: read

jobs:
  build-deb:
    name: Build .deb on Ubuntu
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Linux build deps
        # Compose Multiplatform uses Skiko (Skia) which needs freetype + fontconfig at runtime.
        # jpackage's DebBundler needs fakeroot + dpkg-deb on the build host.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfreetype6 \
            libfontconfig1 \
            fakeroot \
            dpkg \
            binutils

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build .deb
        # Compose Multiplatform: `packageDeb` (debug) or `packageReleaseDeb` (release).
        # Release path outputs to build/compose/binaries/main-release/deb/*.deb
        # Debug path outputs to build/compose/binaries/main/deb/*.deb
        # We're shipping to users, so release it is.
        # Per JetBrains/compose-multiplatform#4622 the .deb lives in build/compose/binaries/**/*.deb.
        run: ./gradlew packageReleaseDeb --no-daemon --stacktrace

      - name: Verify .deb
        run: |
          set -e
          DEB=$(find build/compose/binaries -name '*.deb' -path '*/deb/*' | head -n 1)
          if [ -z "$DEB" ]; then
            echo "::error::No .deb produced"
            ls -laR build/compose/binaries/ || true
            exit 1
          fi
          echo "Built: $DEB"
          du -h "$DEB"
          dpkg-deb --info "$DEB"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-desktop-deb
          path: build/compose/binaries/**/deb/*.deb
          if-no-files-found: error
          retention-days: 30
